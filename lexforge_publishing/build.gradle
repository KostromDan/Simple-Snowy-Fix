plugins {
    id 'java'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

unifiedPublishing {
    project {
        gameVersions = ["1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10"]
        gameLoaders = ["forge"]

        displayName = rootProject.tasks.remapLexforgeJar.archiveFile.get().asFile.name
        version = rootProject.version
        changelog = file('../changelog.md').text
        releaseType = "release"

        mainPublication rootProject.tasks.remapLexforgeJar

        var cfToken = System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "1211256"
            }
        }

        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "3WP3HZRG"
            }
        }
    }
}